name: Generate RTL Schematic

on:
  push:
    branches:
      - master
      - Factorizing_stages

permissions:
  contents: write

jobs:
  build-rtl-schematic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install netlistsvg
        run: npm install -g netlistsvg

      - name: Generate RTL Schematic using Yosys & GHDL Container
        uses: addnab/docker-run-action@v3
        with:
          image: hdlc/ghdl:yosys
          options: -v ${{ github.workspace }}:/work -w /work
          run: |
            FILES=$(find . -type f \( -name "*.vhd" -o -name "*.vhdl" \) ! -name "*tb*" ! -name "*testbench*" | paste -sd " " -)

            # Added 'setundef -zero' to sanitize undefined/high-Z bit enum values for netlistsvg
            yosys -m ghdl -p "ghdl --std=08 --ieee=synopsys -frelaxed --latches $FILES -e CPU_FPGA; hierarchy -top CPU_FPGA; proc; setundef -zero; write_json -compat-int rtl.json"
      - name: Convert JSON to SVG Schematic & Bake Light Background
        run: |
          netlistsvg rtl.json -o rtl_schematic.svg
          # Embed a white background rectangle directly into the SVG canvas so it renders on both dark and light themes
          sed -i 's/<svg /<svg style="background-color: white;" /g' rtl_schematic.svg

      - name: Commit and Push Schematic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rtl_schematic.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update RTL schematic" && git push)
