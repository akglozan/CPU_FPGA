name: Generate RTL Schematic

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-rtl-schematic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install netlistsvg
        run: npm install -g netlistsvg

      - name: Generate RTL Schematic using Yosys & GHDL Container
        uses: addnab/docker-run-action@v3
        with:
          image: hdlc/ghdl:yosys
          options: -v ${{ github.workspace }}:/work -w /work
          run: |
            # 1. Gather design VHDL files into a space-delimited string (excluding testbenches)
            FILES=$(find . -type f \( -name "*.vhd" -o -name "*.vhdl" \) ! -name "*tb*" ! -name "*testbench*" | paste -sd " " -)

            # 2. Elaborate hierarchy without aggressive optimization/pruning of unused submodules
            yosys -m ghdl -p "ghdl --std=08 --ieee=synopsys -frelaxed --latches $FILES -e CPU_FPGA; hierarchy -top CPU_FPGA; proc; write_json -compat-int rtl.json"

      - name: Convert JSON to SVG Schematic & Adapt for Dark Mode
        run: |
          netlistsvg rtl.json -o rtl_schematic.svg
          # Invert stroke and text fills to light gray (#e6edf3) so elements are visible on dark backgrounds
          sed -i 's/stroke="black"/stroke="#e6edf3"/g' rtl_schematic.svg
          sed -i 's/fill="black"/fill="#e6edf3"/g' rtl_schematic.svg

      - name: Commit and Push Schematic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rtl_schematic.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update RTL schematic" && git push)