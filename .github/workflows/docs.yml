name: Build and Deploy Docs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sphinx and sphinx-vhdl
        # Pinned: sphinx-vhdl 0.2.2 imports an internal Sphinx symbol
        # (ObjDescT from sphinx.directives) that newer Sphinx releases
        # have removed/moved, so installing an unpinned "latest" Sphinx
        # breaks the extension's import. Sphinx 8.1.3 is confirmed
        # working with sphinx-vhdl 0.2.2 as of this writing.
        run: pip install "sphinx==8.1.3" sphinx-vhdl

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
